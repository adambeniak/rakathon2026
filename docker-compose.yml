# Local stack: backend + mailpit. The backend talks to the IRIS configured in .env (default: the team ACI).
#   make up && make iris-bootstrap && make seed      # bootstrap + seed are idempotent, run them after every ACI restart
#   curl -s localhost:8000/api/health
#
# Local IRIS instead of ACI (demo fallback) = docker-compose.local-iris.yml:
#   mkdir -p .iris && echo 'local-password' > .iris/password.txt   (same value as IRIS_PASSWORD)
#   make up-local
# The backend container then uses IRIS_HOST=iris (set in the override), but `make iris-bootstrap` and `make seed`
# run on the host and read .env: for the local fallback run them with IRIS_HOST=localhost and
# FHIR_BASE_URL=http://localhost:52773/fhir/r4 (e.g. a second env file). Storage is not persistent, like ACI.
services:
  backend:
    build: ./backend
    # Loopback only: the API has no authentication yet (#4) and serves patient identity.
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    depends_on:
      - mailpit
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=15)"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 10s

  mailpit:
    image: axllent/mailpit@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
