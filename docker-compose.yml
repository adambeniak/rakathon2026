# Local stack: backend + mailpit. The backend talks to the IRIS configured in .env (default: the team ACI).
#   make up && make iris-bootstrap && make seed      # bootstrap + seed are idempotent, run them after every ACI restart
#   curl -s localhost:8000/api/health
#
# Local IRIS instead of ACI (demo fallback) = docker-compose.local-iris.yml:
#   mkdir -p .iris && printf '%s' 'local-password' > .iris/password.txt   (any value; it need NOT match IRIS_PASSWORD)
#   make up-local                 # or: make up-local SCENARIO=story
# One command: starts the local IRIS, waits until it is healthy, bootstraps and seeds it from the host (the IRIS
# connection settings are explicit; other settings, e.g. the embedding provider, still come from the env file), starts
# the backend with the LOCAL password and prints OK/FAIL from /api/health. The env file (team ACI) is never modified.
# Storage is not persistent, like ACI: `make down` removes it.
services:
  backend:
    build: ./backend
    # Loopback only: the API has no authentication yet (#4) and serves patient identity.
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    depends_on:
      - mailpit
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=15)"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 10s

  mailpit:
    image: axllent/mailpit@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
