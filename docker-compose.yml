# Local stack. IRIS uses the same image digest as the team ACI so behaviour matches.
# Storage is intentionally NOT persistent (like ACI): after `make up` always run `make iris-bootstrap && make seed`.
# First run:  mkdir -p .iris && echo 'local-password' > .iris/password.txt  (and the same value as IRIS_PASSWORD in .env)
#             make up && make iris-bootstrap && make seed
# Apple Silicon: this digest is an amd64 image and runs emulated (slow). Use the arm64 variant from Docker Hub
# (separate "-arm64" repository) or develop against the team ACI instance.
# backend/ and frontend/ services are added in phase F1 (see prompts/F1-*.md). Inside docker the backend must use
# IRIS_HOST=iris and FHIR_BASE_URL=http://iris:52773/fhir/r4 (set them under `environment:`, not only env_file).
services:
  iris:
    image: intersystems/irishealth-community@sha256:aad59884bdd89ee21c8cb059937c6b9b26947457641e5e04adecb68754376c6c
    command: --password-file /iris-secrets/password
    ports:
      - "1972:1972"
      - "52773:52773"
    volumes:
      - ./.iris:/iris-secrets
    mem_limit: 2g

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"
